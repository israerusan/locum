name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      # fail-fast stays off: GitHub's macOS runners are sometimes never assigned
      # (the job sits queued with zero steps, then is cancelled). That is runner
      # availability, not a code failure, and it must not cancel or hide the
      # Linux / Windows results.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12", "3.13"]
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags: the version is derived from them (hatch-vcs)

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install X server and clipboard tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth xclip x11-utils

      - name: Install locum
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Import check (core dependencies only)
        run: python -c "import locum, locum.cli, locum.llm, locum.rpa, locum.compat.pyautogui; print(locum.__version__)"

      - name: Test suite incl. X11 tests under Xvfb (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1280x800x24" python -m pytest -q

      - name: Test suite without X11 tests (Windows / macOS)
        if: runner.os != 'Linux'
        run: python -m pytest -q -m "not x11"

      - name: Smoke-test the CLI and examples on the demo desktop
        env:
          LOCUM_BACKEND: mock
        run: |
          locum --version
          locum info
          locum windows --json
          locum observe --window "Invoice Entry"
          locum run examples/excel_report_flow.yaml
          python examples/basic_automation.py
          python examples/sap_style_data_entry.py
          python examples/llm_agent.py < /dev/null
          python examples/pyautogui_migration.py

  # BLOCKING real-desktop self-tests: the path `pip install locum` takes on a user's
  # machine, against each OS's real input, capture and accessibility stack (not the
  # mock backend). They only type into an editor they open themselves and refuse to
  # type into one that already contains text. `--strict` makes a SKIP fail the job
  # (a missing capability must not pass as green); `--retries 2` re-runs a check
  # that a busy hosted runner occasionally fails, and the report keeps the failed
  # attempts. The report is uploaded either way.
  windows-native-selftest:
    name: windows-native-selftest (real desktop, blocking)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags: the version is derived from them (hatch-vcs)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install locum
        run: python -m pip install .

      - name: Self-test against the runner's real desktop
        run: python -m locum.selftest --yes --strict --retries 2 --out selftest-report

      - name: Upload self-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-selftest-report
          path: selftest-report
          if-no-files-found: warn

  # Linux: a real X server (Xvfb) with a window manager, a real D-Bus session and the
  # real AT-SPI registry, driving a real GTK editor (mousepad). This is the stack a
  # Linux desktop user has; the unit-test job above only exercises XTEST/Xlib.
  linux-native-selftest:
    name: linux-native-selftest (X11 + AT-SPI, blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install X server, window manager, AT-SPI and a GTK editor
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth openbox dbus-x11 at-spi2-core libatk-adaptor \
            python3-venv python3-gi gir1.2-atspi-2.0 mousepad xclip x11-utils \
            x11-xserver-utils x11-apps xcompmgr

      # PyGObject (gi) comes from the distro: a venv that sees the system site-packages.
      - name: Install locum
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install .
          .venv/bin/python -c "import gi; gi.require_version('Atspi', '2.0'); from gi.repository import Atspi; print('Atspi', Atspi.get_version())"

      - name: Self-test against a real X11 + AT-SPI desktop
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            Xvfb :99 -screen 0 1280x800x24 -nolisten tcp &
            export DISPLAY=:99
            for i in $(seq 50); do xdpyinfo >/dev/null 2>&1 && break; sleep 0.1; done
            openbox &
            # A real desktop is never one flat colour with no windows: a patterned
            # root and one ordinary X window for the screenshot and window-list checks.
            xsetroot -mod 16 16 -fg grey45 -bg grey25
            xclock -geometry 160x160+1100+20 &
            # A compositing manager, as on a real desktop: window capture reads the
            # composited pixmap of the window itself (covered and off-screen parts included).
            xcompmgr -n &
            /usr/libexec/at-spi-bus-launcher --launch-immediately &
            export GTK_MODULES=gail:atk-bridge NO_AT_BRIDGE=0
            gsettings set org.gnome.desktop.interface toolkit-accessibility true || true
            sleep 2
            .venv/bin/python -m locum.selftest --yes --strict --retries 2 --out selftest-report
          '

      - name: Upload self-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-selftest-report
          path: selftest-report
          if-no-files-found: warn

  # macOS: the real Quartz event, capture and AX stack on a hosted Mac, driving
  # TextEdit. Hosted macOS images pre-grant Accessibility and Screen Recording to
  # the runner's shell (TCC); the strict self-test fails if they ever stop doing so.
  macos-native-selftest:
    name: macos-native-selftest (real desktop, blocking)
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install locum
        run: python -m pip install .

      - name: Self-test against the runner's real desktop
        run: python -m locum.selftest --yes --strict --retries 2 --out selftest-report

      - name: Upload self-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-native-selftest-report
          path: selftest-report
          if-no-files-found: warn

  # BLOCKING: real SendInput on the runner's desktop. Another window takes the focus
  # between finding a target and typing, and in the middle of typing: nothing may
  # reach it. This used to run inside the non-blocking self-test job, so a
  # regression in the input guard could merge green.
  windows-real-desktop-input:
    name: windows-real-desktop-input (blocking)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      LOCUM_TEST_DESKTOP: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install locum
        run: python -m pip install . pytest

      - name: Focus-steal tests against the real desktop
        run: python -m pytest -q -p no:cacheprovider tests/test_real_focus_steal.py

      - name: Desktop input lock across real processes
        run: python -m pytest -q -p no:cacheprovider tests/test_desktop_lock.py

  # BLOCKING: locum.bridges.java against a real JVM. A Swing window
  # (tests/helpers/JabProbe.java) is driven through the Java Access Bridge that
  # ships with the JDK: tree, set_text read-back, AccessibleAction clicks, a
  # window-bound mouse click and reference release.
  windows-java-bridge:
    name: windows-java-bridge (real JVM, blocking)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      LOCUM_TEST_JAVA: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Enable the Java Access Bridge
        shell: pwsh
        run: |
          & "$env:JAVA_HOME\bin\jabswitch.exe" -enable
          Get-Content "$env:USERPROFILE\.accessibility.properties"
          Get-ChildItem "$env:JAVA_HOME\bin\WindowsAccessBridge*.dll"

      - name: Install locum
        run: python -m pip install . pytest

      - name: Java Access Bridge tests against a real Swing window
        run: python -m pytest -v -p no:cacheprovider tests/test_real_java_bridge.py -rs

  # Real-application acceptance: Excel dialogs (+ SAP GUI when the runner has it).
  # Hosted runners have neither, so this runs only on demand on a self-hosted
  # Windows runner labelled `excel` (and `sap` for the SAP scenario), logged in to
  # an interactive desktop. See docs/TESTING.md "Acceptance scenarios".
  acceptance-self-hosted:
    name: acceptance (self-hosted, on demand)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, windows, excel]
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      LOCUM_ACCEPTANCE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install locum
        shell: pwsh
        run: python -m pip install . pytest pywin32 psutil

      - name: Acceptance scenarios
        shell: pwsh
        run: python -m pytest -q -p no:cacheprovider tests/acceptance -m acceptance -rs
