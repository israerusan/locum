name: Release

# Publishes locum to PyPI when a GitHub release is published (tag vX.Y.Z matching
# the version in pyproject.toml). Uses PyPI Trusted Publishing (OIDC): no API token
# is stored anywhere. One-time setup on pypi.org -> Account settings -> Publishing ->
# "Add a new pending publisher": project name `locum`, owner `israerusan`,
# repository `locum`, workflow `release.yml`, environment `pypi`.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::release tag '$GITHUB_REF_NAME' does not match pyproject version '$version'"
            exit 1
          fi

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  verify:
    name: Install the wheel on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install into a clean environment and smoke-test
        env:
          LOCUM_BACKEND: mock
        run: |
          python -m venv venv
          # Absolute path: the smoke test runs from another directory (not the checkout).
          if [ -f venv/Scripts/python.exe ]; then py="$PWD/venv/Scripts/python.exe"; else py="$PWD/venv/bin/python"; fi
          "$py" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$py" -c "import locum, locum.cli, locum.llm, locum.rpa, locum.compat.pyautogui; print(locum.__version__)"
          "$py" -m locum --version
          "$py" -m locum.selftest --backend mock --yes --out selftest-mock

  publish:
    name: Publish to PyPI
    needs: [build, verify]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/locum/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
