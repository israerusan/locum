name: Release

# Publishes locum to PyPI when a GitHub release is published with tag vX.Y.Z. The
# version is not written anywhere by hand: hatch-vcs derives it from that tag, and the
# build refuses to publish anything else. Uses PyPI Trusted Publishing (OIDC): no API token
# is stored anywhere. One-time setup on pypi.org -> Account settings -> Publishing ->
# "Add a new pending publisher": project name `locum`, owner `israerusan`,
# repository `locum`, workflow `release.yml`, environment `pypi`.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags: the version is derived from them (hatch-vcs)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Check the built version is exactly the release tag
        if: github.event_name == 'release'
        # The version comes from the git tag (hatch-vcs). A mismatch means the tag is not
        # on the checked-out commit or the tree was dirty (e.g. 0.1.1.dev0+g1a2b3c4.d2026...).
        run: |
          wheel=$(ls dist/*.whl)
          version=$(basename "$wheel" | cut -d- -f2)
          tag="${GITHUB_REF_NAME#v}"
          echo "built $version from tag $GITHUB_REF_NAME"
          if [ "$version" != "$tag" ]; then
            echo "::error::built version '$version' is not the release tag '$GITHUB_REF_NAME'"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  verify:
    name: Install the wheel on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install into a clean environment and smoke-test
        env:
          LOCUM_BACKEND: mock
        run: |
          python -m venv venv
          # Absolute path: the smoke test runs from another directory (not the checkout).
          if [ -f venv/Scripts/python.exe ]; then py="$PWD/venv/Scripts/python.exe"; else py="$PWD/venv/bin/python"; fi
          "$py" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$py" -c "import locum, locum.cli, locum.llm, locum.rpa, locum.compat.pyautogui; print(locum.__version__)"
          "$py" -m locum --version
          "$py" -m locum.selftest --backend mock --yes --out selftest-mock

  publish:
    name: Publish to PyPI
    needs: [build, verify]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/locum/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
